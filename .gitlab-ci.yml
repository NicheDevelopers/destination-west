# Build configuration file of Destination West

# For information on SAST configuration see:
# https://docs.gitlab.com/ee/user/application_security/sast/

pages:
  stage: deploy
  script:
  - mkdir .public
  - cp -r * .public
  - mv .public public
  artifacts:
    paths:
    - public
  only:
  - main

sast:
  stage: test

include:
- template: Jobs/SAST.gitlab-ci.yml

stages:
- test
- deploy
