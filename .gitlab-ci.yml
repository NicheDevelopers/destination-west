# Build configuration file of Destination West

include:
  - remote: "https://raw.githubusercontent.com/voidzero-dev/setup-vp/v1.21.2/gitlab/setup-vp.yml"
    inputs:
      setup-ref: "v1.21.2"

lint:
  stage: lint
  extends: .setup-vp
  image: node:24
  script:
    - vp lint --deny-warnings

fmt:
  stage: lint
  extends: .setup-vp
  image: node:24
  script:
    - vp fmt --check

test:
  stage: test
  extends: .setup-vp
  image: node:24
  script:
    - vp test

pages:
  stage: deploy
  extends: .setup-vp
  image: node:24
  script:
    - vp run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    - main

stages:
  - lint
  - test
  - deploy
